<script>
// Follows the OS light/dark preference via daisyUI's stable data-theme API
// (rather than daisyUI's build-time --prefersdark plugin flag, which needs
// npm/package resolution the CDN build doesn't have) -- same intent as the
// main app's item-8 "follow OS light/dark" precedent. Named themes chosen
// by the user: cupcake (light) / dracula (dark) -- see themes.css below,
// needed to unlock any theme beyond the two default "light"/"dark".
(function () {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply() { document.documentElement.setAttribute('data-theme', mq.matches ? 'dracula' : 'cupcake'); }
  apply();
  mq.addEventListener('change', apply);
})();
</script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  /* The only thing Tailwind/daisyUI can't express: the transparent-window
     checkerboard behind the preview canvas. */
  .canvas-frame {
    background-image: linear-gradient(45deg, #999 25%, transparent 25%),
      linear-gradient(-45deg, #999 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #999 75%),
      linear-gradient(-45deg, transparent 75%, #999 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  }
  #previewCanvas { display: block; image-rendering: pixelated; }

  /* layout.cfg editor: a syntax-highlighted <pre> sits behind a
     transparent-text <textarea> (same font metrics on both, kept in sync
     by JS on scroll/input) -- native cursor/selection/undo stay exactly as
     a plain textarea's, only the rendered glyphs are colored. */
  .cfg-editor-layer {
    font-family: Consolas, 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.6;
    padding: 10px 12px;
    white-space: pre;
    tab-size: 4;
    box-sizing: border-box;
  }
  #cfgText { color: transparent; background: transparent; }
  .tok-section { font-weight: 600; }
  .tok-comment { font-style: italic; }

  /* Light: a vivid, high-contrast palette in the same role-mapping
     (section/bracket/key/eq/value/comment) as the dark side below --
     independently chosen for legibility, not tied to the cupcake theme's
     own (much lighter) accent colors. */
  #cfgHighlight { background: #f8f8f2; color: #282a36; }
  #cfgText { caret-color: #282a36; }
  #cfgText::selection { background: rgba(111, 66, 193, 0.15); }
  .tok-section { color: #0a9c3e; }
  .tok-bracket { color: #7c3aed; }
  .tok-key { color: #0891b2; }
  .tok-eq { color: #db2777; }
  .tok-value { color: #c2410c; }
  .tok-comment { color: #64748b; }

  /* Dark: the actual Dracula palette (https://draculatheme.com). */
  html[data-theme="dracula"] #cfgHighlight { background: #282a36; color: #f8f8f2; }
  html[data-theme="dracula"] #cfgText { caret-color: #f8f8f2; }
  html[data-theme="dracula"] #cfgText::selection { background: rgba(189, 147, 249, 0.4); }
  html[data-theme="dracula"] .tok-section { color: #50fa7b; }
  html[data-theme="dracula"] .tok-bracket { color: #bd93f9; }
  html[data-theme="dracula"] .tok-key { color: #8be9fd; }
  html[data-theme="dracula"] .tok-eq { color: #ff79c6; }
  html[data-theme="dracula"] .tok-value { color: #f1fa8c; }
  html[data-theme="dracula"] .tok-comment { color: #6272a4; }
</style>
</head>

const table = document.getElementById('results');
const tbody = table.querySelector('tbody');
const summary = document.getElementById('summary');
const EDIT = { section: 'GeneralCompact', key: 'Width', newValue: '999' };

function addRow(label, editLabel, ok, detail) {
  const tr = document.createElement('tr');
  tr.innerHTML =
    `<td>${label}</td><td>${editLabel}</td>` +
    `<td class="${ok ? 'text-success' : 'text-error'} font-bold">${ok ? t('diagPass') : t('diagFail')}</td><td>${detail}</td>`;
  tbody.appendChild(tr);
}

function diffCount(before, after) {
  const max = Math.max(before.length, after.length);
  let n = 0;
  for (let i = 0; i < max; i++) if (before[i] !== after[i]) n++;
  return n;
}

function checkRoundTrip(label, text) {
  const doc = new CfgDoc(text);
  const before = doc.getValue(EDIT.section, EDIT.key);
  if (before === undefined) {
    addRow(label, `${EDIT.section}/${EDIT.key}`, false, t('diagKeyNotFound'));
    return false;
  }
  const beforeLines = text.split(/\r\n|\n/);
  doc.setValue(EDIT.section, EDIT.key, EDIT.newValue);
  const afterLines = doc.toText().split(/\r\n|\n/);
  const changed = diffCount(beforeLines, afterLines);
  const readBack = doc.getValue(EDIT.section, EDIT.key);
  const ok = changed === 1 && readBack === EDIT.newValue;
  addRow(label, `${EDIT.section}/${EDIT.key}: '${before}' -> '${EDIT.newValue}'`, ok,
    t('diagLinesChangedDetail', { n: changed, v: readBack }));
  return ok;
}

// Runs the round-trip check against whatever text is passed in and refreshes
// the table/summary. Used both for the initial check against the freshly
// loaded file (folderInput's change handler) and for the Re-run button,
// which passes the *current* doc text instead of the original file's.
function runDiagnostics(label, text) {
  tbody.innerHTML = '';
  table.hidden = false;
  checkRoundTrip(label, text);
  summary.textContent = tbody.querySelector('.text-error') ? t('diagRoundTripFail') : t('diagRoundTripPass');
}

document.getElementById('btnRerunDiagnostics').addEventListener('click', () => {
  if (!loadedAsset) return;
  runDiagnostics(loadedAsset.name, loadedAsset.doc.toText());
});

// Picks a value guaranteed to differ from the field's current raw value, in
// a shape appropriate to its type -- the round-trip test below only cares
// that it's different and reads back correctly, not that it's semantically
// "valid" (SkinLoader validation is a separate concern from this).
function pickTestValue(field, currentRaw) {
  if (field.type === 'int') {
    const n = parseInt(currentRaw, 10);
    return String((Number.isNaN(n) ? 0 : n) + 1);
  }
  if (field.type === 'bool') {
    const isTrue = currentRaw !== undefined && ['1', 'true', 'yes', 'on'].includes(currentRaw.trim().toLowerCase());
    return isTrue ? '0' : '1';
  }
  if (field.type === 'enum') {
    const idx = field.options.indexOf((currentRaw || '').trim().toLowerCase());
    return field.options[(idx + 1) % field.options.length];
  }
  if (field.type === 'color') {
    return currentRaw === '#123456' ? '#654321' : '#123456';
  }
  return (currentRaw || 'x') + '_chk';
}

// Round-trips one field of one section against `baseText`, on its own
// throwaway CfgDoc (never touches loadedAsset.doc) so every field's test is
// independent of every other's. A key already present must change in
// exactly one line (the same guarantee checkRoundTrip spot-checks for
// GeneralCompact/Width); a key not yet present must add exactly one line.
function checkFieldRoundTrip(sectionName, field, baseText) {
  const doc = new CfgDoc(baseText);
  const before = doc.getValue(sectionName, field.key);
  const beforeLines = baseText.split(/\r\n|\n/);
  const testValue = pickTestValue(field, before);
  doc.setValue(sectionName, field.key, testValue);
  const afterLines = doc.toText().split(/\r\n|\n/);
  const readBack = doc.getValue(sectionName, field.key);
  const editLabel = `${field.key}: '${before === undefined ? '' : before}' -> '${testValue}'`;

  if (before === undefined) {
    const added = afterLines.length - beforeLines.length;
    return { ok: added === 1 && readBack === testValue, editLabel, detail: t('diagInsertDetail', { n: added, v: readBack }) };
  }
  const changed = diffCount(beforeLines, afterLines);
  return { ok: changed === 1 && readBack === testValue, editLabel, detail: t('diagLinesChangedDetail', { n: changed, v: readBack }) };
}

// Sweeps every section currently in the file and, for each one the GUI
// editor recognizes (EditorFields.describeSection), round-trips every one
// of its fields -- the comprehensive counterpart to the single hardcoded
// GeneralCompact/Width spot-check above. Sections with no schema (Other)
// aren't included since there's no field list to test.
function runFullFieldCheck() {
  if (!loadedAsset) return;
  tbody.innerHTML = '';
  table.hidden = false;
  const baseText = loadedAsset.doc.toText();
  let total = 0;
  let failed = 0;
  for (const section of loadedAsset.doc.sections) {
    const desc = EditorFields.describeSection(section.name);
    if (!desc) continue;
    for (const field of desc.fields) {
      total++;
      const result = checkFieldRoundTrip(section.name, field, baseText);
      if (!result.ok) failed++;
      addRow(section.name, result.editLabel, result.ok, result.detail);
    }
  }
  summary.textContent = t('diagFullCheckSummary', { total, failed });
}

document.getElementById('btnCheckAllFields').addEventListener('click', runFullFieldCheck);

// The single currently-loaded asset: { name, cfgPath, doc: <CfgDoc>,
// skin: <SkinLoader.loadSkin result>, images: Map<lowercased filename,
// HTMLImageElement> }, or null.
let loadedAsset = null;

// Manual test state, independent of any real metrics collector -- lets a
// skin author sweep every meter/LED/digit/ping value by hand. Combined
// channels (DiskIo/NetIo/DiskRW/NetActivity) are derived the same way the
// real app derives them (see uMetricsTypes.pas's TMeterBallistics.DiskIo/
// NetIo comments and uMeterRenderer's shared NetActivity/NetTotal draw)
// rather than exposed as separate controls, to keep the control list small.
const METER_KEYS = ['cpu', 'mem', 'swap', 'diskRead', 'diskWrite', 'netIn', 'netOut', 'audio', 'audioL', 'audioR'];
const LED_KEYS = ['diskReadOn', 'diskWriteOn', 'netInOn', 'netOutOn'];
const INITIAL_METER_VALUES = {
  cpu: 0.5, mem: 0.5, swap: 0.2,
  diskRead: 0.3, diskWrite: 0.3,
  netIn: 0.3, netOut: 0.3,
  audio: 0.4, audioL: 0.4, audioR: 0.4,
};
const INITIAL_LED_PING_VALUES = {
  diskReadOn: true, diskWriteOn: false,
  netInOn: true, netOutOn: false,
  pingLevel: 3, // Normal
};

const state = {
  ...INITIAL_METER_VALUES,
  ...INITIAL_LED_PING_VALUES,
};

function derivedState() {
  return {
    ...state,
    diskIo: Math.max(state.diskRead, state.diskWrite),
    netIo: Math.max(state.netIn, state.netOut),
    diskRWOn: state.diskReadOn || state.diskWriteOn,
    netActivityOn: state.netInOn || state.netOutOn,
  };
}

function currentLayout() {
  if (!loadedAsset) return null;
  const useFull = isFullMode && loadedAsset.skin.hasFull;
  return { layout: useFull ? loadedAsset.skin.full : loadedAsset.skin.compact, images: loadedAsset.images };
}

let previewScale = 1;

function repaint() {
  const cur = currentLayout();
  if (!cur) return;
  SkinRenderer.renderFrame(canvas, cur.images, cur.layout, derivedState(), graphHistory);
  // renderFrame sets canvas.width/height (the backing pixel resolution) to
  // the skin's native size every call; re-apply the CSS display size after
  // so the scale picked below survives a layout/mode switch. image-rendering:
  // pixelated (set globally on #previewCanvas) keeps the upscale crisp.
  canvas.style.width = `${canvas.width * previewScale}px`;
  canvas.style.height = `${canvas.height * previewScale}px`;
}

const scaleButtons = { 1: document.getElementById('scale1Btn'), 2: document.getElementById('scale2Btn'), 5: document.getElementById('scale5Btn') };
for (const [scale, el] of Object.entries(scaleButtons)) {
  el.addEventListener('click', () => {
    previewScale = Number(scale);
    for (const b of Object.values(scaleButtons)) b.classList.remove('btn-active');
    el.classList.add('btn-active');
    repaint();
  });
}

// Graph preview: a synthetic rolling history, sampled from the manual
// sliders on a timer -- there's no real metrics collector here, but this is
// the same "1 pixel = 1 sample" model uHistoryBuffer.pas uses, just fed by
// hand instead of TCollector. Only runs while a Full layout with an enabled
// [GraphFull] is actually showing (graph-less skins/modes pay nothing).
let graphHistory = null;
let graphTimer = null;
const GRAPH_SAMPLE_INTERVAL_MS = 300;

function syncGraphState() {
  const cur = currentLayout();
  const graph = cur && cur.layout.graph;
  if (!graph || !graph.enabled) {
    graphHistory = null;
    if (graphTimer) { clearInterval(graphTimer); graphTimer = null; }
    return;
  }
  const capacity = SkinRenderer.graphMaxWidth(graph);
  if (!graphHistory || graphHistory.capacity !== capacity) {
    graphHistory = new HistoryBuffer(capacity);
  }
  if (!graphTimer) {
    graphTimer = setInterval(() => {
      graphHistory.push(state);
      repaint();
    }, GRAPH_SAMPLE_INTERVAL_MS);
  }
}

function slider(container, labelKey, key, min, max, step) {
  const row = document.createElement('label');
  row.className = 'text-xs';
  row.textContent = t(labelKey);
  const input = document.createElement('input');
  input.type = 'range';
  input.className = 'range range-xs';
  input.min = min; input.max = max; input.step = step;
  input.value = state[key];
  const out = document.createElement('span');
  out.className = 'text-xs tabular-nums';
  out.textContent = state[key];
  input.addEventListener('input', () => {
    state[key] = parseFloat(input.value);
    out.textContent = input.value;
    repaint();
  });
  container.appendChild(row);
  container.appendChild(input);
  container.appendChild(out);
}

function sectionLabel(container, textKey) {
  const div = document.createElement('div');
  div.className = 'col-span-3 font-semibold text-xs uppercase tracking-wide text-base-content/60 mt-2';
  div.textContent = t(textKey);
  container.appendChild(div);
}

function toggleRow(container, items) {
  const wrap = document.createElement('div');
  wrap.className = 'col-span-3 flex flex-wrap gap-x-4 gap-y-1';
  for (const [labelKey, key] of items) {
    const lbl = document.createElement('label');
    lbl.className = 'flex items-center gap-1.5 text-xs whitespace-nowrap';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'checkbox checkbox-xs';
    cb.checked = state[key];
    cb.addEventListener('change', () => { state[key] = cb.checked; repaint(); });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(t(labelKey)));
    wrap.appendChild(lbl);
  }
  container.appendChild(wrap);
}

  ]);

  sectionLabel(controlsLedsPing, 'pingHeading');
  const pingWrap = document.createElement('div');
  pingWrap.className = 'col-span-3 flex flex-wrap gap-x-4 gap-y-1';

    rb.addEventListener('change', () => { state.pingLevel = idx; repaint(); });
    lbl.appendChild(rb);
    lbl.appendChild(document.createTextNode(t(labelKey)));
    pingWrap.appendChild(lbl);
  });
  controlsLedsPing.appendChild(pingWrap);
}

// Bulk-set every test-value control at once (meters, LEDs, and Ping), for
// quickly sweeping the whole preview to an extreme or a fresh random spread
// instead of dragging/clicking each one by hand. Rebuilding via
// buildControls() is the simplest way to refresh every control's displayed
// value from the new state, rather than tracking each element individually.
function setAllValues(meterValueForKey, ledValueForKey, pingLevel) {
  for (const key of METER_KEYS) state[key] = meterValueForKey(key);
  for (const key of LED_KEYS) state[key] = ledValueForKey(key);
  state.pingLevel = pingLevel;
  buildControls();
  repaint();
}

function loadImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = URL.createObjectURL(file);
  });
}

// `loadedAsset.doc` (a CfgDoc, cfgModel.js) is the single source of truth
// for the raw text; `loadedAsset.skin` (SkinLoader.loadSkin's result, used
// by Preview) is rebuilt from it after every change, in both directions:
// a GUI field write calls doc.setValue then re-renders the textarea from
// doc.toText(), and a textarea edit rebuilds `doc` from scratch then
// re-parses. Either path ends at applyDocChange(), which is the only place
// that talks to SkinLoader, rebuilds the section tree, and decides whether
// GUI fields stay enabled.

// ---- Syntax highlighting overlay ----
// Tokenizes each line loosely along the same shape cfgModel.js's own
// SECTION_RE/KEY_RE match, purely for display -- this never touches the
// actual text or CfgDoc, it only decides how to color a re-rendered copy
// behind the real (transparent-text) textarea.

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightLine(line) {
  const comment = /^(\s*)(;.*)$/.exec(line);
  if (comment) {
    return escapeHtml(comment[1]) + `<span class="tok-comment">${escapeHtml(comment[2])}</span>`;
  }
  const section = /^(\s*)(\[)([^\]]*)(\])(\s*)$/.exec(line);
  if (section) {
    const [, lead, lb, name, rb, trail] = section;
    return escapeHtml(lead) +
      `<span class="tok-bracket">${escapeHtml(lb)}</span>` +
      `<span class="tok-section">${escapeHtml(name)}</span>` +
      `<span class="tok-bracket">${escapeHtml(rb)}</span>` +
      escapeHtml(trail);
  }
  const kv = /^(\s*)([^=\s][^=]*?)(\s*)(=)(\s*)([^;]*?)(\s*)((?:;.*)?)$/.exec(line);
  if (kv) {
    const [, lead, key, sp1, eq, sp2, value, sp3, trailingComment] = kv;
    return escapeHtml(lead) +
      `<span class="tok-key">${escapeHtml(key)}</span>` + escapeHtml(sp1) +
      `<span class="tok-eq">${escapeHtml(eq)}</span>` + escapeHtml(sp2) +
      `<span class="tok-value">${escapeHtml(value)}</span>` + escapeHtml(sp3) +
      (trailingComment ? `<span class="tok-comment">${escapeHtml(trailingComment)}</span>` : '');
  }
  return escapeHtml(line);
}

function updateHighlight() {
  cfgHighlight.innerHTML = cfgText.value.split('\n').map(highlightLine).join('\n') + '\n';
}

function syncHighlightScroll() {
  cfgHighlight.scrollTop = cfgText.scrollTop;
  cfgHighlight.scrollLeft = cfgText.scrollLeft;
}

// The only place that writes cfgText.value -- keeps the highlight layer
// from ever going stale relative to the real text.
function setCfgText(text) {
  cfgText.value = text;
  updateHighlight();
}

cfgText.addEventListener('scroll', syncHighlightScroll);

// ---- Save ----
// Native save dialog (File System Access API) when the browser allows it in
// this context; it doesn't when the page itself was opened as a plain
// file:// document (Chromium blocks the whole API there, same restriction
// this tool's own loading path was designed around -- see index.html's
// history for why <input webkitdirectory> was chosen over
// showDirectoryPicker for loading in the first place). Falls back to a
// plain Blob download, which the plan's own tech notes already call out as
// the accepted fallback (a manual "move the file into the asset folder"
// step). Saving is never blocked on validity -- a plain text editor doesn't
// refuse to save invalid text either, and the user may be mid-edit.
const btnSave = document.getElementById('btnSave');
const cfgActionMsg = document.getElementById('cfgActionMsg');

async function saveLayoutCfg() {
  const text = loadedAsset.doc.toText();
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'layout.cfg',
        types: [{ description: 'layout.cfg', accept: { 'text/plain': ['.cfg'] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      cfgActionMsg.textContent = t('saveDone');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') { cfgActionMsg.textContent = t('saveCancelled'); return; }
      // Any other failure (most commonly a SecurityError under file://)
      // falls through to the download fallback below.
    }
  }
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'layout.cfg';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  cfgActionMsg.textContent = t('saveDownloaded', { root: loadedAsset.name });
}

btnSave.addEventListener('click', () => { if (loadedAsset) saveLayoutCfg(); });

// Clipboard copy: tries the async Clipboard API first, and falls back to
// the legacy execCommand('copy') (via a hidden, off-screen textarea) since
// navigator.clipboard.writeText is unavailable or throws in some file://
// contexts, while execCommand('copy') still works there.
const btnCopy = document.getElementById('btnCopy');

async function copyLayoutCfg() {
  const text = loadedAsset.doc.toText();
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('unavailable');
    await navigator.clipboard.writeText(text);
    cfgActionMsg.textContent = t('copyDone');
    return;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    cfgActionMsg.textContent = ok ? t('copyDone') : t('copyFailed');
  }
}

btnCopy.addEventListener('click', () => { if (loadedAsset) copyLayoutCfg(); });

function setFieldsEnabled(enabled) {
  fieldsPanel.querySelectorAll('input,select,button').forEach((el) => { el.disabled = !enabled; });
}

// Same truthy rule as ReadStrictBool's accepted "true" spellings
// (uSkinLoader.pas:98-111) -- a blank/missing value reads as `def`.
function boolFromRaw(raw, def) {
  if (raw === undefined || raw.trim() === '') return def;
  return ['1', 'true', 'yes', 'on'].includes(raw.trim().toLowerCase());
}

function intCell(sectionName, field, raw) {
  const cell = document.createElement('div');
  cell.className = 'flex items-center justify-end gap-1';
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'input input-sm w-20';
  input.id = `f_${field.key}`;
  input.value = raw || '';
  input.addEventListener('change', () => onFieldChanged(sectionName, field.key, input.value));

  const step = (delta) => () => {
    const cur = parseInt(input.value, 10);
    onFieldChanged(sectionName, field.key, String((Number.isNaN(cur) ? 0 : cur) + delta));
  };
  const minus = document.createElement('button');
  minus.type = 'button'; minus.className = 'btn btn-sm btn-square'; minus.textContent = '−';
  minus.addEventListener('click', step(-1));
  const plus = document.createElement('button');
  plus.type = 'button'; plus.className = 'btn btn-sm btn-square'; plus.textContent = '+';
  plus.addEventListener('click', step(1));

  cell.appendChild(minus);
  cell.appendChild(input);
  cell.appendChild(plus);
  return cell;
}

function autoFitButton(sectionName) {
  const row = document.createElement('div');
  row.className = 'col-span-2 flex items-center gap-2 mt-1';
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'btn btn-sm';
  button.textContent = t('autoFitButton');
  button.title = t('autoFitButtonTitle');
  const msg = document.createElement('span');
  msg.className = 'text-xs text-base-content/60';
  button.addEventListener('click', () => {
    const bg = (loadedAsset.doc.getValue(sectionName, 'Bg') || '').trim();
    const img = bg && loadedAsset.images.get(bg.toLowerCase());
    if (!bg) { msg.textContent = t('autoFitSetBgFirst'); return; }
    if (!img) { msg.textContent = t('autoFitNotFound', { file: bg }); return; }
    loadedAsset.doc.setValue(sectionName, 'Width', String(img.naturalWidth));
    loadedAsset.doc.setValue(sectionName, 'Height', String(img.naturalHeight));
    setCfgText(loadedAsset.doc.toText());
    msg.textContent = t('autoFitSetTo', { w: img.naturalWidth, h: img.naturalHeight });
    applyDocChange();
  });
  row.appendChild(button);
  row.appendChild(msg);
  return row;
}

// Resolves a field's translated label, interpolating {lane} for the
// per-lane graph fields (field.lane carries the raw, untranslated lane
// name, e.g. "DiskRead").
function fieldText(key, field) {
  return field.lane ? t(key, { lane: field.lane }) : t(key);
}

function renderFieldPanel(sectionName) {
  fieldsPanel.innerHTML = '';
  if (!sectionName) return;
  const desc = EditorFields.describeSection(sectionName);
  noSchemaNote.hidden = !!desc;
  if (!desc) return;

  for (const field of desc.fields) {
    const label = document.createElement('label');
    label.className = 'text-xs pt-1.5 leading-snug break-words';
    label.textContent = fieldText(field.label, field);
    label.title = fieldText(field.hint, field);
    label.htmlFor = `f_${field.key}`;
    fieldsPanel.appendChild(label);

    const raw = loadedAsset.doc.getValue(sectionName, field.key);

    if (field.type === 'bool') {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'checkbox checkbox-sm justify-self-start';
      cb.id = `f_${field.key}`;
      cb.title = fieldText(field.hint, field);
      cb.checked = boolFromRaw(raw, false);
      cb.addEventListener('change', () => onFieldChanged(sectionName, field.key, cb.checked ? '1' : '0'));
      fieldsPanel.appendChild(cb);
    } else if (field.type === 'enum') {
      const sel = document.createElement('select');
      sel.className = 'select select-sm w-full';
      sel.id = `f_${field.key}`;
      sel.title = fieldText(field.hint, field);
      for (const opt of field.options) {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt; // literal layout.cfg value, not translated
        sel.appendChild(o);
      }
      sel.value = (raw || '').trim().toLowerCase() || field.options[0];
      sel.addEventListener('change', () => onFieldChanged(sectionName, field.key, sel.value));
      fieldsPanel.appendChild(sel);
    } else if (field.type === 'color') {
      const cell = document.createElement('div');
      cell.className = 'flex items-center gap-2';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'input input-sm flex-1';
      input.id = `f_${field.key}`;
      input.title = fieldText(field.hint, field);
      input.value = raw || '';
      input.placeholder = t('colorPlaceholder');
      const swatch = document.createElement('div');
      swatch.className = 'w-4 h-4 rounded border border-base-300 shrink-0';
      const paint = () => {
        const c = SkinLoader.tryParseColor(input.value || '');
        swatch.style.background = c ? SkinLoader.colorToCss(c) : 'transparent';
      };
      paint();
      input.addEventListener('input', paint);
      input.addEventListener('change', () => onFieldChanged(sectionName, field.key, input.value));
      cell.appendChild(input);
      cell.appendChild(swatch);
      fieldsPanel.appendChild(cell);
    } else if (field.type === 'int') {
      const cell = intCell(sectionName, field, raw);
      cell.title = fieldText(field.hint, field);
      fieldsPanel.appendChild(cell);
    } else {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'input input-sm w-full';
      input.id = `f_${field.key}`;
      input.title = fieldText(field.hint, field);
      input.value = raw || '';
      input.addEventListener('change', () => onFieldChanged(sectionName, field.key, input.value));
      if (field.fileRef) {
        const trimmed = (raw || '').trim();
        const missing = trimmed !== '' && !loadedAsset.images.has(trimmed.toLowerCase());
        input.classList.toggle('input-error', missing);
        if (missing) input.title = t('fileMissingTitle', { file: trimmed });
      }
      fieldsPanel.appendChild(input);
    }
  }

  if (desc.kind === 'mode') {
    fieldsPanel.appendChild(autoFitButton(sectionName));
  }
  // A section that only exists as a "potential" entry (unchecked in the
  // tree) has no lines to read, so every field above renders blank --
  // still shown and editable, since filling in any field here creates the
  // section on the fly (CfgDoc.setValue's own "section doesn't exist yet"
  // branch), matching the checkbox's own add/remove semantics.
}

function onFieldChanged(sectionName, key, newValue) {
  loadedAsset.doc.setValue(sectionName, key, newValue);
  setCfgText(loadedAsset.doc.toText());
  applyDocChange();
}

// Re-parses loadedAsset.doc's current text via SkinLoader and, on success,
// rebuilds the Preview from it; on failure, disables GUI field edits (but
// never the text pane) and shows the validator's own error (untranslated --
// it mirrors uSkinLoader.pas's own English exception text 1:1). Rebuilds
// the section tree first so an Active-checkbox toggle or a raw text edit
// that adds/removes a section is always reflected, before the validity
// check decides whether the freshly-rendered fields stay enabled.
function applyDocChange() {
  renderSectionTree();
  const text = loadedAsset.doc.toText();
  try {
    const skin = SkinLoader.loadSkin(loadedAsset.cfgPath, text, loadedAsset.name);
    loadedAsset.skin = skin;
    editError.hidden = true;
    editError.textContent = '';
    setFieldsEnabled(true);
    assetLabel.textContent = `${skin.caption} (${loadedAsset.name}) — ${skin.hasFull ? t('assetLabelCompactFull') : t('assetLabelCompactOnly')}`;
    onModeChanged();
  } catch (e) {
    editError.hidden = false;
    editError.textContent = e.message || String(e);
    setFieldsEnabled(false);
  }
}

let cfgTextDebounce = null;
cfgText.addEventListener('input', () => {
  updateHighlight(); // instant, every keystroke -- coloring shouldn't wait on the reparse debounce
  if (cfgTextDebounce) clearTimeout(cfgTextDebounce);
  cfgTextDebounce = setTimeout(() => {
    loadedAsset.doc = new CfgDoc(cfgText.value);
    applyDocChange();
  }, 400);
});

// ---- Section tree ----
// Shows every section the skin engine could use for this suffix (Compact/
// Full), not just the ones actually present in layout.cfg -- grouped by
// kind (per EditorFields.describeSection) so a skin with ~20-30 present
// sections plus ~20 more potential ones per mode stays scannable. Each
// toggleable leaf carries an "Active" checkbox: checked = present in the
// file, and checking/unchecking calls CfgDoc.addSection/removeSection to
// add or remove the whole section. General (required, not "addable") and
// Other (unrecognized sections actually found in the text) are exempt --
// they only ever show what's already present, no checkbox.

function canonicalSectionNames(presentNames) {
  const compactMode = ['GeneralCompact'];
  const compactMeters = EditorFields.METER_BASES.map((b) => b + 'Compact');
  const compactLeds = EditorFields.SPRITE_BASES.map((b) => b + 'Compact');
  const fullMode = ['GeneralFull'];
  const fullMeters = EditorFields.METER_BASES.map((b) => b + 'Full');
  const fullLeds = EditorFields.SPRITE_BASES.map((b) => b + 'Full');
  const fullGraph = ['GraphFull'];
  const general = presentNames.filter((n) => EditorFields.describeSection(n)?.kind === 'general');
  const other = presentNames.filter((n) => !EditorFields.describeSection(n));
  return { general, compactMode, compactMeters, compactLeds, fullMode, fullMeters, fullLeds, fullGraph, other };
}

function toggleSectionActive(name, active) {
  if (active) loadedAsset.doc.addSection(name);
  else loadedAsset.doc.removeSection(name);
  selectedSection = name;
  setCfgText(loadedAsset.doc.toText());
  applyDocChange();
}

function selectSection(name) {
  selectedSection = name;
  sectionTree.querySelectorAll('[data-section]').forEach((el) => {
    el.classList.toggle('bg-primary', el.dataset.section === name);
    el.classList.toggle('text-primary-content', el.dataset.section === name);
  });
  // Follow the selected section's own mode (a *Full section always belongs
  // to the Full layout, *Compact to Compact) so the preview above always
  // shows what this section actually affects. A suffix-less section
  // (General) applies to both -- leave the current mode alone for those.
  if (name.endsWith('Full') && isFullMode !== true) {
    isFullMode = true;
    onModeChanged();
  } else if (name.endsWith('Compact') && isFullMode !== false) {
    isFullMode = false;
    onModeChanged();
  }
  renderFieldPanel(name);
}

function leafItem(name, checkable, isPresent) {
  const li = document.createElement('li');
  const row = document.createElement('div');
  row.dataset.section = name;
  row.className = 'flex items-center gap-2 px-3 py-1.5 rounded-md cursor-pointer hover:bg-base-200';
  row.addEventListener('click', () => selectSection(name));

  const present = checkable ? isPresent(name) : true;

  if (checkable) {
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'checkbox checkbox-xs';
    cb.checked = present;
    cb.title = present ? t('sectionRemoveTitle') : t('sectionAddTitle');
    cb.addEventListener('click', (e) => { e.stopPropagation(); toggleSectionActive(name, cb.checked); });
    row.appendChild(cb);
  }

  const text = document.createElement('span');
  text.className = 'font-mono text-xs' + (present ? '' : ' opacity-50 italic');
  text.textContent = name;
  row.appendChild(text);

  li.appendChild(row);
  return li;
}

function subGroup(labelKey, names, checkable, isPresent) {
  if (names.length === 0) return null;
  const li = document.createElement('li');
  const details = document.createElement('details');
  details.open = true;
  const summary = document.createElement('summary');
  summary.textContent = t(labelKey);
  details.appendChild(summary);
  const ul = document.createElement('ul');
  for (const name of names) ul.appendChild(leafItem(name, checkable, isPresent));
  details.appendChild(ul);
  li.appendChild(details);
  return li;
}

function topGroup(labelKey, subgroups, checkable, isPresent) {
  const li = document.createElement('li');
  const details = document.createElement('details');
  details.open = true;
  const summary = document.createElement('summary');
  summary.textContent = t(labelKey);
  details.appendChild(summary);
  const ul = document.createElement('ul');
  for (const [subLabelKey, names] of subgroups) {
    const sg = subGroup(subLabelKey, names, checkable, isPresent);
    if (sg) ul.appendChild(sg);
  }
  details.appendChild(ul);
  li.appendChild(details);
  return li;
}

function renderSectionTree() {
  const fileOrderNames = loadedAsset.doc.sections.map((s) => s.name);
  const presentLower = new Set(fileOrderNames.map((n) => n.toLowerCase()));
  const isPresent = (name) => presentLower.has(name.toLowerCase());

  const c = canonicalSectionNames(fileOrderNames);
  sectionTree.innerHTML = '';

  const general = subGroup('groupGeneral', c.general, false, isPresent);
  if (general) sectionTree.appendChild(general);

  sectionTree.appendChild(topGroup('groupCompact', [
    ['groupMode', c.compactMode], ['groupMeters', c.compactMeters], ['groupLedsPing', c.compactLeds],
  ], true, isPresent));

  sectionTree.appendChild(topGroup('groupFull', [
    ['groupMode', c.fullMode], ['groupMeters', c.fullMeters], ['groupLedsPing', c.fullLeds], ['groupGraph', c.fullGraph],
  ], true, isPresent));

  const other = subGroup('groupOther', c.other, false, isPresent);
  if (other) sectionTree.appendChild(other);

  const allNames = [
    ...c.general, ...c.compactMode, ...c.compactMeters, ...c.compactLeds,
    ...c.fullMode, ...c.fullMeters, ...c.fullLeds, ...c.fullGraph, ...c.other,
  ];
  const keepSelection = selectedSection && allNames.includes(selectedSection);
  selectSection(keepSelection ? selectedSection : (fileOrderNames[0] || c.compactMode[0]));
}

function initEditor() {
  setCfgText(loadedAsset.doc.toText());
  selectedSection = '';
  applyDocChange();
}

// ---- Loading a single asset folder ----
// The folder the user picks IS the asset: its layout.cfg must sit directly
// inside it (webkitRelativePath "<pickedFolderName>/layout.cfg"), exactly
// like assets/<id>/layout.cfg in this repo. No enumeration of sibling
// asset folders -- deliberately, so a skin developed anywhere on disk (My
// Documents, a USB drive, outside this repo entirely) opens the same way a
// repo asset does.

btn.addEventListener('click', () => folderInput.click());

folderInput.addEventListener('change', async () => {
  const files = Array.from(folderInput.files || []);
  tbody.innerHTML = '';
  summary.textContent = '';
  table.hidden = true;
  skinErrorEl.hidden = true;
  skinErrorEl.textContent = '';
  assetLabel.textContent = '';
  loadedAsset = null;
  workspace.hidden = true;
  previewBar.hidden = true;
  bottomDrawer.hidden = true;
  graphHistory = null;
  if (graphTimer) { clearInterval(graphTimer); graphTimer = null; }
  if (files.length === 0) return;

  const rootName = files[0].webkitRelativePath.split('/')[0];
  const cfgFile = files.find((f) =>
    f.name.toLowerCase() === 'layout.cfg' && f.webkitRelativePath.split('/').length === 2);
  if (!cfgFile) {
    skinErrorEl.hidden = false;
    skinErrorEl.textContent = t('skinErrorNoLayoutCfg', { root: rootName });
    return;
  }

  const text = await cfgFile.text();
  runDiagnostics(rootName, text);

  try {
    const skin = SkinLoader.loadSkin(cfgFile.webkitRelativePath, text, rootName);
    const images = new Map();
    const imageFiles = files.filter((f) => /\.(png|bmp|jpg|jpeg|gif)$/i.test(f.name));
    const loaded = await Promise.all(imageFiles.map(async (f) => [f.name.toLowerCase(), await loadImage(f)]));
    for (const [name, img] of loaded) if (img) images.set(name, img);
    loadedAsset = { name: rootName, cfgPath: cfgFile.webkitRelativePath, doc: new CfgDoc(text), skin, images };
    assetLabel.textContent = `${skin.caption} (${rootName}) — ${skin.hasFull ? t('assetLabelCompactFull') : t('assetLabelCompactOnly')}`;
    introNote.hidden = true;
    workspace.hidden = false;
    previewBar.hidden = false;
    bottomDrawer.hidden = false;
    buildControls();
    onModeChanged();
    initEditor();
  } catch (e) {
    skinErrorEl.hidden = false;
    skinErrorEl.textContent = t('skinErrorFailedToLoad', { root: rootName, msg: e.message || e });
  }
});
</script>
</body>
