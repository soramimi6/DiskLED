; DiskLED 3 display mode definition
; Place this file as assets/<id>/layout.cfg together with images.
;
; Original: legacy System Analog Meter II (sam2) skin, ported for DiskLED 3.
;
; Characteristics: 240x34 compact / 240x52 full, blue color-keyed transparent
; window, analog VU-style needle meters (64-frame sweep). Full adds a
; bar-style history graph.
;
; Meters: Compact = CPU/MEM/SWAP VU meters, Disk Read/Write and Net In/Out
; activity LEDs, Disk Read/Write and Net In/Out speed meters (liquid bar),
; Ping. Full = the same set, plus a Disk Read/Write/Net In/Out history graph.
;
; Assets: Original_Base.png/Original_FullBase.png (window backgrounds);
; Original_Meters.png (one 64-frame CPU/MEM/SWAP needle strip, shared by all
; three via a different X offset each); Original_LedGreen.png/
; Original_LedRed.png (2-frame activity LEDs); Original_LiqBarLR.png/
; Original_LiqBarRL.png (21-frame speed-meter bars, mirrored for disk vs
; net); Original_Ping.png (4-frame ping level).

[General]
Id=original
Caption=Original
Order=10
Default=1

[GeneralCompact]
Width=240
Height=34
Transparent=1
MaskColor=#0000FF
Bg=Original_Base.png

[GeneralFull]
Width=240
Height=52
Bg=Original_FullBase.png
Transparent=1
MaskColor=#0000FF

[GraphFull]
; Legacy sam2 SkinL DiskR / DiskW / NetI / NetO (1px = 1 sample; color = Metalic black)
Style=bar
DiskRead=98,40,29,8
DiskReadColor=#434343
DiskWrite=131,40,29,8
DiskWriteColor=#434343
NetIn=170,40,29,8
NetInColor=#434343
NetOut=203,40,29,8
NetOutColor=#434343

