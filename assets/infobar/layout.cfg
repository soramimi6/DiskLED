; DiskLED 3 display mode definition
; Place this file as assets/<id>/layout.cfg together with images.
;
; Info Bar: new for DiskLED 3.
;
; Characteristics: 285x16 compact / 531x16 full, opaque black rectangular
; window (no transparency), horizontal LED-bar meters throughout -- the
; widest and, in Full, the most information-dense of the bundled skins.
;
; Meters: Compact = CPU usage bar, Disk Read/Write and Net In/Out activity
; LEDs, Ping, playback volume L/R bars. Full = CPU/MEM/SWAP usage bars, Disk
; Read/Write and Net In/Out speed bars, Ping, playback volume L/R bars (no
; activity LEDs).

[General]
Id=infobar
Caption=Info Bar
Order=40
Default=0

[GeneralCompact]
Width=285
Height=16
Transparent=0
MaskColor=#000000
Bg=InfoBar_Base_Compact.png

