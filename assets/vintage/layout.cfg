; DiskLED 3 display mode definition
; Place this file as assets/<id>/layout.cfg together with images.
;
; Vintage: new for DiskLED 3.
;
; Characteristics: 232x32 compact / 416x32 full, magenta color-keyed
; transparent window, analog VU-meter dials with a smoothly animated
; 64-frame needle sweep. Ticks and labels are faded toward the cream face
; so the needle reads more clearly against them.
;
; Meters: Compact = CPU/MEM usage, Disk I/O and Net I/O combined activity
; (DiskIoMeter/NetIoMeter = Max(Read,Write)/Max(In,Out)), volume (mono).
; Full = CPU/MEM/SWAP usage, Disk Read/Write and Net In/Out shown
; separately, volume as a stereo L/R pair.

[General]
Id=vintage
Caption=Vintage
Order=50
Default=0

[GeneralCompact]
Width=232
Height=32
Transparent=1
MaskColor=#FF00FF
Bg=vintage_compact_bg.png

[GeneralFull]
Width=416
Height=32
Transparent=1
MaskColor=#FF00FF
Bg=vintage_full_bg.png

