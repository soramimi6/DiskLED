; DiskLED 3 display mode definition
; Place this file as assets/<id>/layout.cfg together with images.
;
; Vintage: analog VU-meter skin. Art is machine-generated by a local Pillow
; script (kept for regen/tuning only, not part of the release payload).
; Compact = CPU/MEM/DSK/NET/SND, Full =
; CPU/MEM/SWP/R/W/IN/OUT/SND. DSK/NET are Max(Read,Write)/Max(In,Out)
; composite dials (DiskIoMeter/NetIoMeter); R/W/IN/OUT show the four channels
; separately. A meter without an activity lamp (CPU/MEM/SWP/SND) has a screw
; baked into its housing image at the needle's pivot; a meter with one
; (DSK/NET, R/W/IN/OUT) leaves that spot blank in its housing image and shows
; the real on/off lamp sprite there instead.
;
; Compact and full hold no shared state: every setting (including Kind=/
; Strength=) is defined once per section named for its own view (Compact/
; Full suffix) -- see assets/LAYOUT.md. CPU/MEM/SND reuse the very same
; housing image in both CpuCompact/CpuFull etc. (only SND's X differs); the
; rest are compact-only or full-only, so they simply have no counterpart
; section in the other view.
;
; Each vintage_<meter>.png is a self-contained 64-frame strip: housing, dial
; face, ticks, label and needle are all baked into one opaque image per
; frame (not composited from a separate needle sprite at runtime), so the
; needle-to-face edge anti-aliases normally -- only each housing's own outer
; boundary is color-keyed, and that boundary is identical across all 64
; frames of a given meter.

[General]
Id=vintage
Caption=Vintage
Order=50
Default=0

[GeneralCompact]
Width=232
Height=32
Transparent=1
MaskColor=#FF00FF
Bg=vintage_compact_bg.png

[GeneralFull]
Width=370
Height=32
Transparent=1
MaskColor=#FF00FF
Bg=vintage_full_bg.png

