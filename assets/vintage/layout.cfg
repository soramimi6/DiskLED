; DiskLED 3 display mode definition
; Place this file as assets/<id>/layout.cfg together with images.
;
; Vintage: new for DiskLED 3.
;
; Characteristics: 232x32 compact / 416x32 full, magenta color-keyed
; transparent window, analog VU-meter housings baked frame-by-frame (case,
; ticks, label and needle all in one opaque image per angle) by
; tools/gen_vintage.py (kept for regen/tuning only, not part of the release
; payload -- see tools/stage-dist.ps1's copy list; re-run it after changing
; any of its constants rather than hand-editing these PNGs). Ticks and
; labels are faded toward the cream face (INK_FADE) so the needle reads
; more clearly against them. Each needle's true hinge sits hidden behind
; the panel's bottom bezel, at the case's own bottom edge, so only the part
; of the needle above that edge is ever drawn.
;
; Meters: Compact = CPU/MEM usage, Disk I/O and Net I/O combined activity
; (DiskIoMeter/NetIoMeter = Max(Read,Write)/Max(In,Out)), volume (mono).
; Full = CPU/MEM/SWAP usage, Disk Read/Write and Net In/Out shown
; separately, volume as a stereo L/R pair. A meter without an activity lamp
; (CPU/MEM/SWP/SND/AudioL/AudioR) has a screw baked into its housing,
; centered in the black case strip below the panel; a meter with one
; (DSK/NET compact, R/W/IN/OUT full) leaves that spot blank for the real
; on/off lamp sprite instead.
;
; Assets: vintage_<meter>.png (one self-contained 64-frame, 44x32 strip per
; unique meter design -- cpu/mem/swp/dsk/net/snd/r/w/in/out/sndl/sndr; CPU/MEM
; are reused by both compact and full; vintage_sndl.png/vintage_sndr.png
; share vintage_snd.png's design with the label swapped to L/R);
; vintage_lamp.png (one 2-frame, 6x6 on/off lamp strip, shared by every
; lamp-slot meter); vintage_compact_bg.png/vintage_full_bg.png (flat
; magenta color-key window plates -- the housings live in the per-meter
; strips above, not here).

[General]
Id=vintage
Caption=Vintage
Order=50
Default=0

[GeneralCompact]
Width=232
Height=32
Transparent=1
MaskColor=#FF00FF
Bg=vintage_compact_bg.png

[GeneralFull]
