; DiskLED 3 display mode definition
; Place this file as assets/<id>/layout.cfg together with images.
;
; Crystal: legacy Mac OS X-style (MacX) skin, ported for DiskLED 3.
;
; Characteristics: 192x14, compact only (no full view), black color-keyed
; transparent window, flat bar-style usage meters (32 frames) and small
; activity LEDs -- the smallest of the bundled skins.
;
; Meters: CPU/MEM usage bars, Disk Read/Write activity LEDs, Net
; activity/In/Out activity LEDs, Ping.

[General]
Id=crystal
Caption=Crystal
Order=20
Default=0

[GeneralCompact]
Width=192
Height=14
Transparent=1
MaskColor=#000000
Bg=Crystal_Base.png

[CpuCompact]
File=Crystal_CPU_Level.png
X=4
Y=0
Frames=32
Kind=bar
Strength=50

[MemCompact]
